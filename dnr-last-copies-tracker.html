<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnR Last Copies — Pharmacy 22</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 1rem;
            color: #fff;
        }
        .subheader {
            font-size: 12px;
            color: #888;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .last-copies {
            display: grid;
            gap: 12px;
        }
        .item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .item.active {
            border-color: #e85d5d;
            background: #1a0a0a;
        }
        .item-info h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #fff;
        }
        .item-info p {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        .item-info .price {
            color: #4ade80;
            font-weight: 500;
        }
        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .btn-copy {
            padding: 8px 12px;
            background: #6b5eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: #5a4dd9;
        }
        .btn-link {
            padding: 8px 12px;
            background: transparent;
            color: #6b5eff;
            border: 1px solid #6b5eff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-link:hover {
            background: #6b5eff;
            color: #fff;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e85d5d;
            color: #fff;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 8px;
        }
        .empty {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 14px;
        }
        .last-updated {
            font-size: 11px;
            color: #666;
            margin-top: 2rem;
            text-align: center;
        }
        .copy-success {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #1a3a1a;
            color: #4ade80;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }
        .copy-success.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 DnR Last Copies</h1>
        <div class="subheader">Pharmacy 22 market intel — urgent stock</div>

        <div class="last-copies" id="lastCopies"></div>

        <div class="last-updated">
            Last scanned: <span id="lastScan">never</span><br>
            <button onclick="scanNow()" style="margin-top: 12px; padding: 6px 12px; background: #333; color: #ccc; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Scan now</button>
        </div>
    </div>

    <div class="copy-success" id="copySuccess">Copied to clipboard! Paste into Priority App task.</div>

    <script>
        const STORAGE_KEY = 'dnr_last_copies';

        // Load sample data on first load
        function initData() {
            let data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                const sampleData = [
                    {
                        title: 'Jacobs Ladder EP',
                        artist: 'Efan (Bassline)',
                        price: '£15.99',
                        link: 'https://dnrvinyl.co.uk/product/jacobs-ladder-ep-efan/',
                        status: 'LAST COPIES',
                        scanned: new Date().toLocaleString()
                    }
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleData));
                data = sampleData;
            } else {
                data = JSON.parse(data);
            }
            return data;
        }

        function render() {
            let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const container = document.getElementById('lastCopies');

            if (data.length === 0) {
                container.innerHTML = '<div class="empty">No last copies at DnR right now. Check back later!</div>';
                return;
            }

            container.innerHTML = data.map((item, i) => `
                <div class="item active">
                    <div class="item-info">
                        <h3>${item.title}</h3>
                        <p>${item.artist}</p>
                        <p class="price">${item.price}</p>
                        <span class="status-badge">${item.status}</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-copy" onclick="copyToClipboard('${item.title}', '${item.artist}', '${item.price}', '${item.link}')">Copy</button>
                        <a href="${item.link}" target="_blank" class="btn-link">View</a>
                        <button class="btn-copy" style="background: #333; color: #ccc;" onclick="removeItem(${i})">Remove</button>
                    </div>
                </div>
            `).join('');

            // Update last scanned time
            if (data.length > 0) {
                document.getElementById('lastScan').textContent = data[0].scanned || 'just now';
            }
        }

        function copyToClipboard(title, artist, price, link) {
            const text = `DnR Last Copies: ${title} — ${artist} | ${price} | ${link}`;
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.getElementById('copySuccess');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);
            });
        }

        function removeItem(index) {
            let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            data.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
        }

        function scanNow() {
            // This would connect to Claude API to scan DnR automatically
            // For now, just show a message
            alert('Tell Castro: "Scan DnR last copies now" in the chat to update this list');
        }

        // Init on load
        document.addEventListener('DOMContentLoaded', () => {
            initData();
            render();
        });
    </script>
</body>
</html>
