<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Priority App">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23333' width='180' height='180'/><text x='50%' y='50%' font-size='80' fill='white' text-anchor='middle' dy='.3em' font-weight='bold'>C4</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23333' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dy='.3em' font-weight='bold'>C4</text></svg>">
  <link rel="manifest" href="manifest.json">
  <title>Priority App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      width: 100%;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    
    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }
    
    .input-section {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 1.5rem;
    }
    
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .input-row input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    
    .input-row input:focus {
      outline: none;
      border-color: #333;
    }
    
    .input-row select {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      background: white;
      cursor: pointer;
      min-width: 110px;
    }
    
    .input-row select:focus {
      outline: none;
      border-color: #333;
    }
    
    .input-row-bottom {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .input-row-bottom select {
      min-width: 90px;
    }
    
    button {
      padding: 12px 16px;
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    
    button:active {
      background: #555;
    }
    
    button.secondary {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }
    
    button.secondary:active {
      background: #e0e0e0;
    }
    
    button.danger {
      background: #e24b4a;
    }
    
    button.danger:active {
      background: #c93a39;
    }
    
    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      overflow-x: auto;
    }
    
    .filter-btn {
      padding: 8px 12px;
      background: white;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .filter-btn.active {
      background: #333;
      color: white;
      border-color: #333;
      font-weight: 500;
    }
    
    .filter-btn:active {
      opacity: 0.8;
    }
    
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1rem;
    }
    
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-left: 3px solid #333;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    
    .task-item.done {
      opacity: 0.6;
    }
    
    .task-item input[type="checkbox"] {
      margin-top: 4px;
      cursor: pointer;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    
    .task-content {
      flex: 1;
      min-width: 0;
    }
    
    .task-title {
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-word;
    }
    
    .task-item.done .task-title {
      text-decoration: line-through;
      color: #999;
    }
    
    .task-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #666;
    }
    
    .task-delete {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 20px;
      height: fit-content;
      flex-shrink: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .task-delete:active {
      color: #e24b4a;
    }
    
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #999;
      font-size: 14px;
    }
    
    .stats {
      margin-top: 1rem;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
    
    .stats strong {
      color: #333;
    }
    
    .priority-high { border-left-color: #e24b4a !important; }
    .priority-medium { border-left-color: #ba7517 !important; }
    .priority-low { border-left-color: #888 !important; }
    
    .priority-badge {
      font-weight: 500;
      font-size: 12px;
    }
    
    .priority-high .priority-badge { color: #e24b4a; }
    .priority-medium .priority-badge { color: #ba7517; }
    .priority-low .priority-badge { color: #888; }
    
    .c4stro-section {
      display: none;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 1.5rem;
    }
    
    .c4stro-section.active {
      display: block;
    }
    
    .c4stro-section h2 {
      font-size: 16px;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
      font-weight: 500;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #333;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .dates-section {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      display: none;
    }
    
    .dates-section.active {
      display: block;
    }
    
    .dates-section h4 {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #333;
    }
    
    .date-input-group {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .date-input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin: 0;
    }
    
    .date-input-group span {
      font-size: 12px;
      color: #666;
      min-width: 40px;
    }
    
    .payments-list {
      margin-top: 1rem;
    }
    
    .payment-item {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #eee;
      margin-bottom: 8px;
    }
    
    .payment-bar {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 8px;
    }
    
    .payment-details {
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    
    .payment-dates {
      font-size: 11px;
      color: #999;
      margin-bottom: 8px;
    }
    
    .payment-actions {
      display: flex;
      gap: 6px;
    }
    
    .payment-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 100%;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h3 {
      margin-bottom: 1rem;
      font-size: 16px;
    }
    
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Priority App</h1>
    
    <div class="input-section">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a priority…">
        <select id="projectSelect">
          <option>Pharmacy 22</option>
          <option>Pitchcraft</option>
          <option>C4STRO</option>
        </select>
      </div>
      <div class="input-row-bottom">
        <select id="prioritySelect">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button onclick="addTask()">Add</button>
      </div>
    </div>

    <div class="c4stro-section" id="c4stroSection">
      <h2>Recibos & Payments</h2>
      
      <div class="form-group">
        <label>Nome do bar / Spot</label>
        <input type="text" id="barName" placeholder="Ex: Bar do João">
      </div>
      
      <div class="form-group">
        <label>Email de contacto</label>
        <input type="email" id="barEmail" placeholder="contacto@bar.com">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Vezes que tocaste</label>
          <input type="number" id="gigsCount" placeholder="0" value="1" min="1" onchange="updateDateInputs()">
        </div>
        <div class="form-group">
          <label>Valor a receber (€)</label>
          <input type="number" id="paymentAmount" placeholder="0" step="0.01" min="0">
        </div>
      </div>
      
      <div class="dates-section" id="datesSection">
        <h4>Data de cada apresentação</h4>
        <div id="dateInputsContainer"></div>
      </div>
      
      <button onclick="addPayment()" style="width: 100%; margin-top: 12px;">Adicionar Gig</button>
      
      <div class="payments-list" id="paymentsList"></div>
    </div>

    <div class="filter-buttons" id="filterButtons"></div>

    <div class="tasks-list" id="tasksList"></div>
    
    <div class="stats">
      <strong id="activeCount">0</strong> active · <strong id="doneCount">0</strong> done
    </div>
  </div>

  <div class="modal-overlay" id="receiptModal">
    <div class="modal">
      <h3>Enviar Recibo</h3>
      <p id="receiptPreview" style="font-size: 13px; line-height: 1.8; color: #666;"></p>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeReceiptModal()">Cancelar</button>
        <button onclick="sendReceiptToGmail()">Enviar via Gmail</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const STORAGE_KEY = 'priority-app-tasks';
    const PAYMENTS_KEY = 'c4stro-payments';
    const projects = ['Pharmacy 22', 'Pitchcraft', 'C4STRO'];
    let tasks = [];
    let payments = [];
    let currentFilter = 'all';
    let currentPaymentId = null;

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        tasks = JSON.parse(stored);
      }
      const paymentStored = localStorage.getItem(PAYMENTS_KEY);
      if (paymentStored) {
        payments = JSON.parse(paymentStored);
      }
      render();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      localStorage.setItem(PAYMENTS_KEY, JSON.stringify(payments));
    }

    function updateDateInputs() {
      const gigsCount = parseInt(document.getElementById('gigsCount').value) || 1;
      const container = document.getElementById('dateInputsContainer');
      const section = document.getElementById('datesSection');

      if (gigsCount > 0) {
        section.classList.add('active');
        let html = '';
        for (let i = 1; i <= gigsCount; i++) {
          const inputId = `gigDate${i}`;
          html += `
            <div class="date-input-group">
              <span>Gig ${i}:</span>
              <input type="date" id="${inputId}">
            </div>
          `;
        }
        container.innerHTML = html;
      } else {
        section.classList.remove('active');
      }
    }

    function getGigDates() {
      const gigsCount = parseInt(document.getElementById('gigsCount').value) || 1;
      const dates = [];
      for (let i = 1; i <= gigsCount; i++) {
        const dateInput = document.getElementById(`gigDate${i}`);
        if (dateInput && dateInput.value) {
          dates.push(dateInput.value);
        }
      }
      return dates;
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const project = document.getElementById('projectSelect').value;
      const priority = document.getElementById('prioritySelect').value;

      if (!input.value.trim()) return;

      const task = {
        id: Date.now(),
        title: input.value,
        project: project,
        priority: priority,
        done: false
      };

      tasks.unshift(task);
      saveData();
      input.value = '';
      render();
    }

    function addPayment() {
      const barName = document.getElementById('barName').value.trim();
      const barEmail = document.getElementById('barEmail').value.trim();
      const gigsCount = parseInt(document.getElementById('gigsCount').value) || 1;
      const amount = parseFloat(document.getElementById('paymentAmount').value) || 0;
      const dates = getGigDates();

      if (!barName || !barEmail || amount <= 0) {
        alert('Preenche todos os campos corretamente');
        return;
      }

      if (dates.length === 0) {
        alert('Preenche pelo menos uma data');
        return;
      }

      const payment = {
        id: Date.now(),
        bar: barName,
        email: barEmail,
        gigs: gigsCount,
        amount: amount,
        dates: dates
      };

      payments.unshift(payment);
      saveData();

      document.getElementById('barName').value = '';
      document.getElementById('barEmail').value = '';
      document.getElementById('gigsCount').value = '1';
      document.getElementById('paymentAmount').value = '';
      updateDateInputs();

      renderPayments();
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('pt-PT');
    }

    function previewReceipt(paymentId) {
      const payment = payments.find(p => p.id === paymentId);
      if (!payment) return;

      currentPaymentId = paymentId;

      let datesHTML = payment.dates.map((d, idx) => `Apresentação ${idx + 1}: ${formatDate(d)}`).join('<br>');

      const preview = `
        <strong>Recibo de Pagamento</strong><br><br>
        <strong>Bar/Spot:</strong> ${payment.bar}<br>
        <strong>Email:</strong> ${payment.email}<br><br>
        <strong>Apresentações:</strong><br>
        ${datesHTML}<br><br>
        <strong>Número total:</strong> ${payment.gigs}<br>
        <strong>Valor total:</strong> €${payment.amount.toFixed(2)}<br>
        <strong>Valor por apresentação:</strong> €${(payment.amount / payment.gigs).toFixed(2)}<br><br>
        <em>Data do recibo: ${new Date().toLocaleDateString('pt-PT')}</em>
      `;

      document.getElementById('receiptPreview').innerHTML = preview;
      document.getElementById('receiptModal').classList.add('active');
    }

    function closeReceiptModal() {
      document.getElementById('receiptModal').classList.remove('active');
      currentPaymentId = null;
    }

    function sendReceiptToGmail() {
      const payment = payments.find(p => p.id === currentPaymentId);
      if (!payment) return;

      const subject = `Recibo de Pagamento - ${payment.bar}`;
      
      let datesText = payment.dates.map((d, idx) => `Apresentação ${idx + 1}: ${formatDate(d)}`).join('\n');

      const body = `Olá,

Segue em anexo o recibo de pagamento pelas minhas apresentações em ${payment.bar}.

Detalhes:
${datesText}

- Número de apresentações: ${payment.gigs}
- Valor total: €${payment.amount.toFixed(2)}
- Valor por apresentação: €${(payment.amount / payment.gigs).toFixed(2)}

Data do recibo: ${new Date().toLocaleDateString('pt-PT')}

Obrigado!`;

      const mailtoUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(payment.email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

      window.open(mailtoUrl, '_blank');

      closeReceiptModal();
      
      setTimeout(() => {
        payments = payments.filter(p => p.id !== currentPaymentId);
        saveData();
        renderPayments();
      }, 500);
    }

    function deletePayment(id) {
      if (confirm('Apagar este recibo?')) {
        payments = payments.filter(p => p.id !== id);
        saveData();
        renderPayments();
      }
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        saveData();
        render();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveData();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      render();
    }

    function getFilteredTasks() {
      let filtered = tasks;

      if (currentFilter !== 'all' && currentFilter !== 'c4stro') {
        filtered = filtered.filter(t => t.project === currentFilter);
      }

      return filtered.sort((a, b) => {
        const priorityOrder = { high: 0, medium: 1, low: 2 };
        return priorityOrder[a.priority] - priorityOrder[b.priority];
      });
    }

    function getProjectStats(project) {
      return tasks.filter(t => t.project === project && !t.done).length;
    }

    function renderPayments() {
      const container = document.getElementById('paymentsList');

      if (payments.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = payments.map(p => {
        const datesStr = p.dates.map(d => formatDate(d)).join(', ');
        return `
          <div class="payment-item">
            <div class="payment-bar">${p.bar}</div>
            <div class="payment-details">
              <span>${p.gigs}x</span>
              <span>€${p.amount.toFixed(2)}</span>
            </div>
            <div class="payment-dates">
              ${datesStr}
            </div>
            <div class="payment-actions">
              <button class="secondary" onclick="previewReceipt(${p.id})">Enviar</button>
              <button class="danger" onclick="deletePayment(${p.id})">×</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      renderFilterButtons();
      renderTasks();
      renderStats();
      renderC4stroSection();
    }

    function renderC4stroSection() {
      const showC4stro = currentFilter === 'C4STRO' || currentFilter === 'c4stro';
      const section = document.getElementById('c4stroSection');
      if (showC4stro) {
        section.classList.add('active');
        renderPayments();
      } else {
        section.classList.remove('active');
      }
    }

    function renderFilterButtons() {
      const container = document.getElementById('filterButtons');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn' + (currentFilter === 'all' ? ' active' : '');
      allBtn.textContent = `All (${tasks.length})`;
      allBtn.onclick = () => setFilter('all');
      container.appendChild(allBtn);

      projects.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (currentFilter === p ? ' active' : '');
        const count = getProjectStats(p);
        btn.textContent = `${p}${count > 0 ? ` (${count})` : ''}`;
        btn.onclick = () => setFilter(p);
        container.appendChild(btn);
      });
    }

    function renderTasks() {
      const container = document.getElementById('tasksList');
      const filtered = getFilteredTasks();

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No priorities yet. Add one to get started.</div>';
        return;
      }

      container.innerHTML = filtered.map(task => `
        <div class="task-item priority-${task.priority} ${task.done ? 'done' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
          <div class="task-content">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-meta">
              <span>${task.project}</span>
              <span class="priority-badge">${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
            </div>
          </div>
          <button class="task-delete" onclick="deleteTask(${task.id})">✕</button>
        </div>
      `).join('');
    }

    function renderStats() {
      const active = tasks.filter(t => !t.done).length;
      const done = tasks.filter(t => t.done).length;
      document.getElementById('activeCount').textContent = active;
      document.getElementById('doneCount').textContent = done;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('taskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    loadData();
  </script>
</body>
</html>
