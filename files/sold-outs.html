<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy 22 — Out of Stock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            padding: 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 2rem;
            color: #fff;
        }

        h2 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #fff;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
            margin-top: 1rem;
        }

        label:first-child {
            margin-top: 0;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e8e8e8;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #666;
            background: #111;
        }

        input::placeholder {
            color: #555;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 10px 16px;
            background: #e8e8e8;
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            margin-top: 1rem;
        }

        button:hover {
            background: #fff;
        }

        button:disabled {
            background: #444;
            color: #999;
            cursor: not-allowed;
        }

        .btn-search {
            background: #333;
            color: #e8e8e8;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .btn-search:hover {
            background: #444;
        }

        .message {
            padding: 10px 12px;
            background: #1a3a1a;
            color: #7ecc7e;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 1rem;
        }

        .message.error {
            background: #3a1a1a;
            color: #e07878;
        }

        .entry {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .entry-title {
            font-weight: 500;
            color: #fff;
        }

        .entry-label {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .entry-details {
            font-size: 12px;
            color: #999;
            display: grid;
            grid-template-columns: auto auto;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #e07878;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
            width: auto;
        }

        .btn-remove:hover {
            color: #ff9999;
        }

        .empty {
            font-size: 13px;
            color: #666;
        }

        a {
            color: #7ecc7e;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #searchResults {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 1000px;
            }
        }

        .entry a {
            display: inline-block;
            padding: 6px 10px;
            background: #2a5a2a;
            border: 1px solid #4a7a4a;
            border-radius: 3px;
            font-size: 12px;
        }

        .entry a:hover {
            background: #3a7a3a;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">

        <a href="../index.html" style="display:block; margin-bottom:1.5rem; color:#7ecc7e; text-decoration:none;">
            ← Back to Priority App
        </a>
        <h1>Pharmacy 22 — Out of Stock</h1>

        <!-- Add Form -->
        <div class="card">
            <h2>Add out of stock</h2>
            <form id="addForm">
                <label>Artist</label>
                <input type="text" id="artist" placeholder="Artist name" required>

                <label>Title</label>
                <input type="text" id="title" placeholder="Release title" required>

                <div class="form-row">
                    <div>
                        <label>Label</label>
                        <input type="text" id="label" placeholder="Label">
                    </div>
                    <div>
                        <label>Release date</label>
                        <input type="date" id="releaseDate">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label>Time to sold out</label>
                        <input type="text" id="timeToSoldOut" placeholder="e.g., 3 hours">
                    </div>
                    <div>
                        <label>Store</label>
                        <select id="store">
                            <option>Juno</option>
                            <option>Phonica</option>
                            <option>DnR</option>
                        </select>
                    </div>
                </div>

                <label>Link</label>
                <input type="url" id="link" placeholder="https://...">

                <button type="submit">Add out of stock</button>
            </form>
        </div>

        <!-- Search Button -->
        <button class="btn-search" id="searchBtn">Search out of stock</button>

        <!-- Message -->
        <div id="message"></div>

        <!-- Search Results -->
        <div id="searchResults" style="display: none;">
            <div class="card">
                <h2>Search Results (<span id="resultsCount">0</span>)</h2>
                <div id="results"></div>
                <button id="clearResultsBtn" class="btn-search" style="margin-top: 1rem; background: #333;">Clear Results</button>
            </div>
        </div>

        <!-- History -->
        <div class="card">
            <h2>History (<span id="count">0</span>)</h2>
            <div id="history"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pharmacy22-soldouts';
        let soldOuts = [];

        // Load data on start
        loadSoldOuts();

        // Form submit
        document.getElementById('addForm').addEventListener('submit', handleAddSoldOut);

        // Search button
        document.getElementById('searchBtn').addEventListener('click', handleSearchSoldOuts);

        // Clear results button
        document.getElementById('clearResultsBtn').addEventListener('click', function() {
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('results').innerHTML = '';
            showMessage('Results cleared');
        });

        function loadSoldOuts() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    soldOuts = JSON.parse(data);
                }
            } catch (e) {
                console.log('No saved data');
            }
            renderHistory();
        }

        function saveSoldOuts() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(soldOuts));
            } catch (e) {
                showMessage('Failed to save', true);
            }
        }

        function handleAddSoldOut(e) {
            e.preventDefault();

            const artist = document.getElementById('artist').value.trim();
            const title = document.getElementById('title').value.trim();

            if (!artist || !title) {
                showMessage('Fill artist and title', true);
                return;
            }

            const entry = {
                id: Date.now(),
                artist,
                title,
                label: document.getElementById('label').value.trim(),
                releaseDate: document.getElementById('releaseDate').value,
                timeToSoldOut: document.getElementById('timeToSoldOut').value.trim(),
                store: document.getElementById('store').value,
                link: document.getElementById('link').value.trim(),
                addedAt: new Date().toISOString().split('T')[0]
            };

            soldOuts.unshift(entry);
            saveSoldOuts();
            renderHistory();
            
            // Reset form
            document.getElementById('addForm').reset();
            showMessage('Added');
        }

        function handleSearchSoldOuts() {
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Searching...';

            const today = new Date();
            const twoMonthsAgo = new Date(today.getTime() - 61 * 24 * 60 * 60 * 1000);
            const oneMonthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);

            const startDate = twoMonthsAgo.toISOString().split('T')[0];
            const endDate = oneMonthAgo.toISOString().split('T')[0];

            const prompt = `Search Juno Records (juno.co.uk), Phonica Records (phonicarecords.com), and DnR Vinyl (dnrvinyl.co.uk) UK Garage sections.

Find vinyl records that are currently OUT OF STOCK.

For each OUT OF STOCK item found, return:
Artist | Title | Label | Cat# | Release Date (YYYY-MM-DD) | Store | Direct product URL

Example:
Frazer Ray | Masha EP | Time Is Now | TIN 080V | 2026-08-10 | Juno | https://juno.co.uk/products/...

Return every OUT OF STOCK UK Garage vinyl you find.
If none: respond with only "No out of stock items found"
No other text.`;

            fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'claude-opus-4-6',
                    max_tokens: 2000,
                    tools: [
                        {
                            type: 'web_search_20250305',
                            name: 'web_search'
                        }
                    ],
                    messages: [{ role: 'user', content: prompt }]
                })
            })
            .then(r => r.json())
            .then(data => {
                // Extract text from response (may include tool use blocks)
                let result = '';
                if (data.content && data.content.length > 0) {
                    for (let block of data.content) {
                        if (block.type === 'text') {
                            result += block.text;
                        }
                    }
                }
                
                result = result.trim();
                if (!result || result.includes('No out of stock')) {
                    showMessage('No out of stock items found right now', true);
                    document.getElementById('searchResults').style.display = 'none';
                } else {
                    displaySearchResults(result, startDate, endDate);
                    const count = result.split('\n').filter(l => l.includes('|')).length;
                    showMessage('Found ' + count + ' sold out(s)!');
                }
            })
            .catch(e => {
                showMessage('Search failed: ' + e.message, true);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Search out of stock';
            });
        }

        function displaySearchResults(results, startDate, endDate) {
            const lines = results.split('\n').filter(line => line.trim().length > 0);
            const resultsDiv = document.getElementById('results');
            const searchResultsSection = document.getElementById('searchResults');
            
            resultsDiv.innerHTML = '';
            
            lines.forEach(line => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 7) {
                    const artist = parts[0];
                    const title = parts[1];
                    const label = parts[2];
                    const catNum = parts[3];
                    const releaseDate = parts[4];
                    const store = parts[5];
                    const url = parts[6];
                    
                    const resultItem = document.createElement('div');
                    resultItem.className = 'entry';
                    resultItem.innerHTML = `
                        <div class="entry-header">
                            <div>
                                <div class="entry-title">${artist} — ${title}</div>
                                <div class="entry-label">${label} (${catNum}) • ${store}</div>
                            </div>
                            <button class="btn-remove" onclick="addFromSearch('${artist.replace(/'/g, "\\'")}', '${title.replace(/'/g, "\\'")}', '${label.replace(/'/g, "\\'")}', '${releaseDate}', '${store}', '${url.replace(/'/g, "\\'")}')">+ Add</button>
                        </div>
                        <div class="entry-details">
                            <span>Released: ${releaseDate}</span>
                            <a href="${url}" target="_blank">View on ${store}</a>
                        </div>
                    `;
                    resultsDiv.appendChild(resultItem);
                }
            });
            
            document.getElementById('resultsCount').textContent = lines.length;
            searchResultsSection.style.display = 'block';
        }

        function addFromSearch(artist, title, label, releaseDate, store, url) {
            const entry = {
                id: Date.now(),
                artist,
                title,
                label,
                releaseDate,
                timeToSoldOut: '',
                store,
                link: url,
                addedAt: new Date().toISOString().split('T')[0]
            };
            
            soldOuts.unshift(entry);
            saveSoldOuts();
            renderHistory();
            showMessage('Added to history!');
        }

        function renderHistory() {
            document.getElementById('count').textContent = soldOuts.length;

            const historyDiv = document.getElementById('history');
            if (soldOuts.length === 0) {
                historyDiv.innerHTML = '<p class="empty">No sold outs tracked yet</p>';
                return;
            }

            historyDiv.innerHTML = soldOuts.map(item => `
                <div class="entry">
                    <div class="entry-header">
                        <div>
                            <div class="entry-title">${item.artist} — ${item.title}</div>
                            <div class="entry-label">${item.label} • ${item.store}</div>
                        </div>
                        <button class="btn-remove" onclick="deleteEntry(${item.id})">Remove</button>
                    </div>
                    <div class="entry-details">
                        <span>Release: ${item.releaseDate || '—'}</span>
                        <span>Sold out: ${item.timeToSoldOut || '—'}</span>
                        <span>Added: ${item.addedAt}</span>
                        ${item.link ? `<a href="${item.link}" target="_blank">View</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function deleteEntry(id) {
            soldOuts = soldOuts.filter(item => item.id !== id);
            saveSoldOuts();
            renderHistory();
        }

        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message' + (isError ? ' error' : '');
            
            if (!isError) {
                setTimeout(() => {
                    msg.textContent = '';
                    msg.className = '';
                }, 3000);
            }
        }
    </script>
</body>
</html>
